<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Theme: Blue White</title>
  <meta name="description" content="Undangan pernikahan digital">
  <meta property="og:title" content="Undangan Pernikahan">
  <meta property="og:description" content="Jadilah bagian dari momen bahagia kami">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.google.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Dancing+Script:wght@500;600;700&family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="page-cover">

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-inner">
      <div class="loading-ring"></div>
      <p class="loading-text">Memuat undangan...</p>
    </div>
  </div>

  <!-- Background & Efek -->
  <div class="bg-video-overlay"></div>
  <div class="side-backdrop"></div>
  <div class="birds" id="birds" aria-hidden="true"></div>

  <div class="app">
    <section class="cover" id="cover">
      <div class="cover-bg"></div>
      <div class="cover-overlay"></div>

      <!-- ===== LAYER BUNGA (5 POSISI) ===== -->
      <div class="flower-layer">
        <div class="flower kiri-atas"></div>
        <div class="flower kanan-atas"></div>
        <div class="flower kiri-bawah"></div>
        <div class="flower tengah-bawah"></div>
        <div class="flower kanan-bawah"></div>
      </div>

      <!-- ===== KONTEN TEKS ===== -->
      <div class="cover-content">
        <div class="cover-title-block">
          <p class="eyebrow-script">The</p>
          <p class="eyebrow-script">Wedding of</p>
          <h1 class="couple-names-cover">
            <span id="coverGroom">Mempelai Pria</span>
            <span class="amp">&amp;</span>
            <span id="coverBride">Mempelai Wanita</span>
          </h1>
          <p class="cover-date" id="coverDate">Memuat tanggal...</p>
        </div>

        <div class="cover-guestcard">
          <p class="to-label">kepada yth.</p>
          <p class="to-name" id="guestName">Bapak/Ibu/Saudara/i</p>
        </div>

        <a class="btn-open" id="btnOpenInvitation" href="isi.html"> Buka Undangan
          <!-- <span class="btn-open-icon">&#9993;</span> -->
        </a>
      </div>
    </section>
  </div>

  <audio id="bgMusic" loop preload="auto"></audio>

  <script src="script.js"></script>
</body>

</html>
